[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ro"
version = "0.1.0"
description = "RO-membrane CFD automation helpers"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
# Runtime Ansys stack stays in requirements.txt (Windows server).
# Optimization uses NumPy. BoTorch/PyTorch are not required.

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
